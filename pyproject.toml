[project]
name = "fl-studio-pan-rule"
version = "0.1.0"
description = "Reverse-engineered FL Studio mixer-track pan rule for stereo signals"
readme = "README.md"
authors = [
    { name = "BioHazard", email = "3482991796@qq.com" }
]
requires-python = ">=3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.scripts]
fl-studio-pan-rule = "fl_studio_pan_rule:main"

[project.optional-dependencies]
# only needed by tools/scan_engine_for_pan_law.py
reverse-engineering = [
    "capstone>=5.0.9",
    "pefile>=2024.8.26",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
